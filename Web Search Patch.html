<html>
<head>
<meta charset="UTF-8">
<title>Windows Server Rollup Patch</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container">

<div class="row justify-content-center">
<div class="col-md-6 mt-5">

<h3 class="text-center">Windows Server Rollup Patch</h3>

<br>

<p class="text-center">Enter Server Name</p>

<br>

<input type="text" id="ServerName" class="form-control" placeholder="Enter Server Name (English)">

<br>

<div class="text-center">
<button class="btn btn-primary" onclick="searchPatch()">Search</button>
</div>

<hr>

<div id="result" class="text-center"></div>

</div>
</div>

</div>

<script>
var vpatch=[
{server:"aaa",patch:"January 2026 - KB5073723 (OS Build 17763.8276)"},
{server:"bbb",patch:"February 2026 - KB5075904 (OS Build 17763.8389)"},
{server:"ccc",patch:"March 2026• KB5078752 (OS Build 17763.8511)"},
{server:"ddd",patch:"April 2026• KB5082123"}
];

function searchPatch(){

var ServerName=document.getElementById("ServerName").value;

if(ServerName==""){

document.getElementById("result").innerHTML="โปรดใส่ชื่อเซิร์ฟเวอร์";

return;

}

var check=/^[a-zA-Z0-9-]+$/;

if(!check.test(ServerName)){

document.getElementById("result").innerHTML="ข้อมูลไม่ถูกต้อง";

return;

}

var found=0;

for(var i=0;i<vpatch.length;i++){

if(ServerName==vpatch[i].server){

document.getElementById("result").innerHTML=
"<p><b>Server Name :</b> "+vpatch[i].server+"</p>"+
"<p><b>Rollup Patch :</b> "+vpatch[i].patch+"</p>";

found=1;

break;

}

}

if(found==0){

document.getElementById("result").innerHTML="ไม่พบข้อมูล";

}

}

</script>

</body>
</html>
